name: 'Build and Release Plugin'

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      package-name: ${{ steps.get-version.outputs.package-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: './global.json'

      - name: Get Version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "package-name=jellyfin-plugin-dismiss-continue-watching-$VERSION.zip" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Update Version
        run: |
          cd build
          ./update-version.sh "${{ steps.get-version.outputs.version }}"

      - name: Build Plugin
        run: |
          cd build
          ./build.sh --configuration Release --package

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: plugin-package
          path: bin/${{ steps.get-version.outputs.package-name }}
          retention-days: 30

      - name: Upload Plugin Files
        uses: actions/upload-artifact@v6
        with:
          name: plugin-files
          path: bin/plugin/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: plugin-package
          path: ./artifacts

      - name: Generate Release Notes
        id: generate-notes
        run: |
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          PREV_TAG=""
          if [ -n "$CURRENT_TAG" ]; then
            PREV_TAG=$(git tag --sort=-version:refname | grep -A1 "^${CURRENT_TAG}$" | tail -1 | grep -v "^${CURRENT_TAG}$" || echo "")
          fi

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" --reverse)
          else
            COMMITS=$(git log --pretty=format:"- %s" --reverse "$PREV_TAG"..HEAD)
          fi

          RELEASE_NOTES="## Changes"$'\n\n'"${COMMITS:-"- Initial release"}"$'\n\n'
          RELEASE_NOTES="$RELEASE_NOTES"$'\n'"## Installation"$'\n\n'
          RELEASE_NOTES="$RELEASE_NOTES"$'1. Download the package file\n'
          RELEASE_NOTES="$RELEASE_NOTES"$'2. Extract to your Jellyfin plugins directory (or install via catalog)\n'
          RELEASE_NOTES="$RELEASE_NOTES"$'3. Ensure JavaScript Injector is installed\n'
          RELEASE_NOTES="$RELEASE_NOTES"$'4. Restart Jellyfin\n\n'

          PACKAGE_PATH="./artifacts/${{ needs.build.outputs.package-name }}"
          if [ -f "$PACKAGE_PATH" ]; then
            CHECKSUM=$(sha256sum "$PACKAGE_PATH" | cut -d' ' -f1)
            RELEASE_NOTES="$RELEASE_NOTES"$'## Checksums\n\n'
            RELEASE_NOTES="$RELEASE_NOTES"$'**SHA256:** `'"$CHECKSUM"$'`\n'
          fi

          echo "$RELEASE_NOTES" > release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'Release v${{ needs.build.outputs.version }}'
          body_path: release_notes.md
          files: ./artifacts/${{ needs.build.outputs.package-name }}
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          generate_release_notes: false
          # Keep release asset identical to the zip whose checksum we write below
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Plugin Manifest
        run: |
          echo "Updating manifest.json with version ${{ needs.build.outputs.version }}"

          REPO_URL="https://github.com/${{ github.repository }}"
          VERSION="v${{ needs.build.outputs.version }}"
          PACKAGE="${{ needs.build.outputs.package-name }}"
          DOWNLOAD_URL="${REPO_URL}/releases/download/${VERSION}/${PACKAGE}"
          PACKAGE_PATH="./artifacts/${{ needs.build.outputs.package-name }}"

          if [ -f "$PACKAGE_PATH" ]; then
            CHECKSUM=$(md5sum "$PACKAGE_PATH" | cut -d' ' -f1)
          else
            echo "Warning: Package file not found, using placeholder checksum"
            CHECKSUM="placeholder"
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ASSEMBLY_VERSION="${{ needs.build.outputs.version }}.0"

          NEW_VERSION='{
              "version": "'${ASSEMBLY_VERSION}'",
              "changelog": "- See the full changelog at [GitHub]('${REPO_URL}'/releases/tag/'${VERSION}')\n",
              "targetAbi": "12.0.0.0",
              "sourceUrl": "'${DOWNLOAD_URL}'",
              "checksum": "'${CHECKSUM}'",
              "timestamp": "'${TIMESTAMP}'"
          }'

          jq --argjson newver "$NEW_VERSION" '.[0].versions = [$newver] + .[0].versions' manifest.json > manifest_updated.json
          mv manifest_updated.json manifest.json
          jq empty manifest.json

      - name: Commit and Push Manifest
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if git diff --quiet manifest.json; then
            echo "No changes to manifest.json"
          else
            git fetch origin main
            git checkout main || git checkout -b main origin/main
            git add manifest.json
            git commit -m "chore: update manifest.json for release v${{ needs.build.outputs.version }}"
            git push origin main
          fi
